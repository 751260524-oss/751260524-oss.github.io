<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资源管理器</title><link rel="stylesheet" href="manager.css"></head><body><main><header><div><span class="eyebrow">LOCAL TOOL / RESOURCE MANAGER</span><h1>资源管理器</h1><p>在本机维护 <code>src/data/resources.json</code>，不会连接服务器。</p></div><button id="open">打开 resources.json</button></header><section class="toolbar"><input id="search" placeholder="搜索名称、简介或分类"><select id="filter"><option value="全部">全部分类</option></select><button id="new">新增资源</button><button id="save" disabled>保存到 JSON</button></section><div id="notice" class="notice">请先打开项目中的 resources.json。</div><section id="editor" class="editor hidden"><h2 id="editorTitle">新增资源</h2><form id="form"><input type="hidden" id="id"><label>资源名称<input required id="title"></label><label>分类<select id="category"></select></label><label>简介<textarea required id="description"></textarea></label><label>百度网盘链接<input id="url" type="url" placeholder="https://pan.baidu.com/..."></label><div class="checks"><label><input type="checkbox" id="featured"> 推荐资源</label><label><input type="checkbox" id="enabled" checked> 上线显示</label></div><div><button type="submit">保存项目</button><button type="button" id="cancel">取消</button></div></form></section><section id="list" class="list"></section></main><script src="manager.js"></script></body></html>
